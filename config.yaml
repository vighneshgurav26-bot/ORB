# ORB DESK — Rs 1,00,000 — Opening Range Breakout from the user's doc
# Separate from the main 5L desk. Its own repo, its own state.

account:
  starting_capital: 100000.0
  currency: INR
risk_ceiling:
  max_risk_per_trade_pct: 2.0
  max_premium_deployed_pct: 25.0
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 7.0
  max_trades_per_day: 2
  max_concurrent_positions: 3
  max_lots_per_position: 2
  kill_switch_drawdown_pct: 15.0
session:
  open: 09:15
  close: '15:30'
  no_entry_before: 09:20
  no_entry_after: '14:45'
  force_flat_at: '15:15'
universe:
  indices:
  - NIFTY
  - BANKNIFTY
  - FINNIFTY
  - MIDCPNIFTY
  stocks:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - SBIN
  - AXISBANK
  - KOTAKBANK
  - BHARTIARTL
  - LT
  - ITC
  - BAJFINANCE
  - MARUTI
  - TATAMOTORS
  - TATASTEEL
  - HINDALCO
  - ADANIENT
  - SUNPHARMA
  - TITAN
  - M&M
  max_underlyings_live: 4
  screen_every_cycle: true
liquidity:
  common:
    max_share_of_touch: 0.5
    max_impact_pct: 0.35
  index:
    min_sessions_left: 3.0
    min_premium: 60.0
    max_premium: 900.0
    max_spread_pct: 0.7
    min_oi: 150000
    min_volume: 50000
    max_total_friction_pct: 1.6
  stock:
    min_sessions_left: 6.0
    min_premium: 20.0
    max_premium: 400.0
    max_spread_pct: 1.1
    min_oi: 200000
    min_volume: 40000
    max_total_friction_pct: 2.2
volatility:
  min_atr_pct: 0.03
  min_expected_move_per_session_pct: 0.4
  min_rv_iv_ratio: 0.85
  min_edge_ratio: 1.5
  min_realised_edge_ratio: 1.3
costs:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.15
  txn_charge_pct: 0.03553
  sebi_pct: 0.0001
  ipft_pct: 1.0e-06
  stamp_buy_pct: 0.003
  gst_pct: 18.0
  slippage_ticks: 1
  tick_size: 0.05
  synthetic_spread_pct:
    index_liquid: 0.35
    index_far: 1.2
    stock: 1.0
market:
  risk_free_rate: 0.065
  trading_days_per_year: 252
  calendar_days_per_year: 365
data:
  provider: auto
  underlying_candles: yahoo
  snapshot_interval_sec: 60
brain:
  model: claude-sonnet-4-6
  review_every_n_trades: 10
  review_after_idle_hours: 30
  promotion:
    min_backtest_trades: 20
    min_paper_trades_before_promote: 15
    require_positive_expectancy: true
  max_tokens: 4000
